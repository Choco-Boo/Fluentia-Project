<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Syne:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <!-- NAV BAR -->
      <header class="navbar">
        <nav class="navbar-nav">
          <button class="nav-button" onclick="window.location.href='signup.html'">Home</button>
        </nav>
      </header>

      <!-- INTRO -->
      <section id="intro">
        <div class="hero-tag">Language Proficiency</div>
        <h1 class="hero-title">Measure Your<br /><em>True Level</em></h1>
        <p class="hero-body">
          A structured assessment across language proficiency concepts.
          Answer honestly — the feedback is personalised to where you actually
          are.
        </p>
        <div class="hero-meta">
          <div class="meta-item">
            <span class="meta-value">22</span>
            <span class="meta-label">Questions</span>
          </div>
          <div class="meta-divider"></div>
          <div class="meta-item">
            <span class="meta-value">20</span>
            <span class="meta-label">Minutes</span>
          </div>
          <div class="meta-divider"></div>
          <div class="meta-item">
            <span class="meta-value">5</span>
            <span class="meta-label">Formats</span>
          </div>
        </div>
        <button class="btn-start" onclick="startAssessment()">
          <span>Begin Assessment</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M3 8h10M9 4l4 4-4 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </section>

      <!-- QUESTION SCREEN -->
      <section id="question-screen">
        <div class="progress-wrapper" id="progress-bar">
          <div class="progress-steps" id="pip-row"></div>
          <div class="progress-text" id="progress-text"></div>
        </div>
        <div id="q-mount"></div>
      </section>

      <!-- RESULTS SCREEN -->
      <section id="results-screen">
        <div class="results-wrapper" id="results-mount"></div>
      </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
